[tool.poetry]
name = "mxsm"
version = "0.9.11"
description = "MX Cross Assembler"
authors = ["Anubhav Mattoo <anubhavmattoo@outlook.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
auto-click = "^0.0.11"
bnf = "^1.0.4"
anytree = "^2.13.0"
click = "^8.1.8"
prompt-toolkit = "^3.0.52"

[tool.poetry.scripts]
mxsm = "mxsm.cli:main"
mxsm-link = "mxsm.cli:link_main"
bin2mif = "mxsm.cli:bin2mif_main"
hex2mif = "mxsm.cli:hex2mif_main"
readmx = "mxsm.cli:readelf_main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
